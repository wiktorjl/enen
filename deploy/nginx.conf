server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Revalidation avoids mixing an older HTML shell with newer JS/Wasm files
    # after a deployment while still allowing browser caches to retain bytes.
    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/wasm application/octet-stream text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /assets/nn.c {
        types { text/plain c; }
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location ~* \.(?:tra|tes)$ {
        types {
            application/octet-stream tra;
            application/octet-stream tes;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
